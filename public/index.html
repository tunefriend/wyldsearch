<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c0b">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Wyldsearch — search the web privately. No tracking, no profiles, no ads.">
  <title>Wyldsearch</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/logo.png" type="image/png" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="search" type="application/opensearchdescription+xml" title="Wyldsearch" href="/opensearch.xml">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("wyldsearch") || "{}");
        var t = s.theme || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#q-home">Skip to search</a>
  <button class="gear" type="button" id="open-settings" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 13a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V19a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H5a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V5a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H19a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
    </svg>
  </button>

  <dialog class="settings" id="settings" aria-labelledby="settings-title">
    <form class="settings-form" method="dialog">
      <h2 id="settings-title">Settings</h2>
      <p class="settings-note">Saved on this device only. No account, no cookies.</p>

      <h3>Appearance</h3>
      <div class="theme-picks" role="radiogroup" aria-label="Appearance">
        <label><input type="radio" name="theme" value="dark" checked> Dark</label>
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="system"> System</label>
      </div>

      <h3>Search sources</h3>
      <fieldset class="engine-list">
        <legend class="skip">Engines</legend>
        <label>
          <input type="checkbox" name="engine" value="duckduckgo" checked>
          <strong>DuckDuckGo</strong>
          <small>Web and news</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="wikipedia" checked>
          <strong>Wikipedia</strong>
          <small>Web results and the side card</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="commons" checked>
          <strong>Wikimedia Commons</strong>
          <small>Images</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="wikinews" checked>
          <strong>Wikinews</strong>
          <small>News</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="peertube" checked>
          <strong>PeerTube</strong>
          <small>Videos via SepiaSearch</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="searxng" checked>
          <strong>SearxNG</strong>
          <small id="searxng-hint">All tabs, if you connected an instance</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="brave">
          <strong>Brave</strong>
          <small id="brave-hint">Official Brave Search API, or SearxNG</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="google">
          <strong>Google</strong>
          <small id="google-hint">SearxNG or Google Programmable Search — we never scrape google.com</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="bing">
          <strong>Bing</strong>
          <small id="bing-hint">SearxNG or Bing Search API — we never scrape bing.com</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="startpage">
          <strong>Startpage</strong>
          <small>Via your SearxNG instance</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="qwant">
          <strong>Qwant</strong>
          <small>Via your SearxNG instance</small>
        </label>
        <label>
          <input type="checkbox" name="engine" value="yahoo">
          <strong>Yahoo</strong>
          <small>Via your SearxNG instance</small>
        </label>
      </fieldset>
      <button class="settings-done" value="ok">Done</button>
    </form>
  </dialog>

  <section id="home" class="home">
    <div class="home-main">
      <img class="logo-hero" src="/assets/logo.png" width="220" height="142" alt="Wyldsearch">
      <h1 class="wordmark">Wyldsearch</h1>
      <form class="search-form" action="/" method="get" role="search">
        <label class="skip" for="q-home">Search</label>
        <input id="q-home" type="search" name="q" placeholder="Search the web privately" maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" required>
        <input type="hidden" name="t" value="web">
        <button type="submit">Search</button>
      </form>
    </div>
    <footer class="home-foot">
      <p class="promise">No tracking. No profiles. No ads.</p>
      <p><a href="/about.html">About</a></p>
    </footer>
  </section>

  <section id="results" class="results hidden">
    <header class="results-head">
      <a class="brand" href="/" title="Wyldsearch home">
        <img src="/assets/logo.png" width="72" height="46" alt="">
        <span class="brand-name">Wyldsearch</span>
      </a>
      <form class="search-form" action="/" method="get" role="search">
        <label class="skip" for="q-results">Search</label>
        <input id="q-results" type="search" name="q" placeholder="Search the web privately" maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" required>
        <input type="hidden" name="t" id="tab-field" value="web">
        <button type="submit">Search</button>
      </form>
    </header>

    <nav class="tabs" aria-label="Result type">
      <button class="tab" type="button" data-tab="web" aria-selected="true">Web</button>
      <button class="tab" type="button" data-tab="images" aria-selected="false">Images</button>
      <button class="tab" type="button" data-tab="news" aria-selected="false">News</button>
      <button class="tab" type="button" data-tab="videos" aria-selected="false">Videos</button>
    </nav>

    <div class="results-body">
      <div id="list" aria-live="polite"></div>
      <aside id="card" hidden></aside>
    </div>

    <footer class="results-foot">
      No tracking. No profiles. No ads. · <a href="/about.html">About</a>
    </footer>
  </section>

  <noscript>
    <p class="about-wrap">Wyldsearch needs JavaScript to show results. The search box still works as a GET form if you enable it.</p>
  </noscript>
  <script src="/js/app.js" defer></script>
</body>
</html>
